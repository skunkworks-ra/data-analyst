# MeerKAT frequency bands.
# Ported from the legacy freq_to_band_name ladder; label ranges are the receiver
# specs. UHF and L overlap in the 856–1088 MHz region (real receiver overlap).
canonical: MeerKAT
aliases: [MEERKAT, MEERKAT+, MKT]
bands:
  - {code: UHF, min_ghz: 0.544, max_ghz: 1.088, label: "UHF-band (544–1088 MHz)"}
  - {code: L,   min_ghz: 0.856, max_ghz: 1.712, label: "L-band (856–1712 MHz)"}
  - {code: S,   min_ghz: 1.750, max_ghz: 3.500, label: "S-band (1.75–3.5 GHz)"}
# SEFD (Jy) keyed by band code. From 11-imaging.md §Step 7. The legacy dict also
# carried C: 420, but MeerKAT has no C-band receiver (no C band above) so it was
# unreachable — dropped.
sefd_jy:
  L: 400
  S: 380
